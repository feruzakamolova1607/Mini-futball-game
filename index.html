
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Futbol</title>
<style>
body {
  margin: 0;
  text-align: center;
  font-family: Arial, sans-serif;
  background: #123c25;
  color: white;
}
h1 { margin: 16px; }
#field {
  position: relative;
  width: min(90vw, 600px);
  height: 340px;
  margin: 15px auto;
  background: #269447;
  border: 4px solid white;
  box-sizing: border-box;
  overflow: hidden;
}
#field::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 2px solid white;
  pointer-events: none;
}
#goal {
  position: absolute;
  top: 0;
  left: 35%;
  width: 30%;
  height: 48px;
  border: 4px solid white;
  box-sizing: border-box;
  background: #ffffff33;
}
#ball {
  position: absolute;
  left: calc(50% - 18px);
  bottom: 45px;
  font-size: 36px;
  transition: left .35s, bottom .35s;
}
#keeper {
  position: absolute;
  top: 65px;
  left: calc(50% - 18px);
  font-size: 34px;
  transition: left .25s;
}
button {
  padding: 12px 22px;
  margin: 5px;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  cursor: pointer;
}
#shoot { background: #ffdc35; }
</style>
</head>
<body>
<h1>⚽ Mini Futbol</h1>
<p>To‘pni darvozaga tepib, gol uring!</p>
<div id="field">
  <div id="goal"></div>
  <div id="keeper">🧤</div>
  <div id="ball">⚽</div>
</div>
<h2 id="score">Gollar: 0</h2>
<p id="message">O‘yinni boshlang!</p>
<button id="shoot" onclick="shoot()">TO‘P TEPISH</button>
<button onclick="resetGame()">QAYTA BOSHLASH</button>
<script>
let goals = 0;
let shots = 0;

function shoot() {
  if (shots >= 5) {
    document.getElementById("message").textContent =
      "O‘yin tugadi! Qayta boshlang.";
    return;
  }

  shots++;
  const ball = document.getElementById("ball");
  const keeper = document.getElementById("keeper");
  const message = document.getElementById("message");

  const target = 38 + Math.random() * 24;
  const save = 35 + Math.random() * 30;

  ball.style.left = `calc(${target}% - 18px)`;
  ball.style.bottom = "245px";
  keeper.style.left = `calc(${save}% - 18px)`;

  if (Math.abs(target - save) < 10) {
    message.textContent = "Darvozabon to‘pni qaytardi!";
  } else {
    goals++;
    message.textContent = "GOOOL! Ajoyib zarba!";
  }

  document.getElementById("score").textContent =
    `Gollar: ${goals} | Zarba: ${shots}/5`;

  document.getElementById("shoot").disabled = true;
  setTimeout(() => {
    ball.style.left = "calc(50% - 18px)";
    ball.style.bottom = "45px";
    document.getElementById("shoot").disabled = false;
  }, 500);
}

function resetGame() {
  goals = 0;
  shots = 0;
  document.getElementById("score").textContent = "Gollar: 0";
  document.getElementById("message").textContent = "O‘yinni boshlang!";
  document.getElementById("ball").style.left = "calc(50% - 18px)";
  document.getElementById("ball").style.bottom = "45px";
  document.getElementById("keeper").style.left = "calc(50% - 18px)";
  document.getElementById("shoot").disabled = false;
}
</script>
</body>
</html>
