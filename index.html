
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Super Penalti ⚽</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 18px 12px;
  text-align: center;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(#102e25, #071710);
}
h1 { margin: 5px 0; font-size: 30px; }
p { color: #d5eadb; }
.panel {
  max-width: 540px;
  margin: 16px auto;
  padding: 12px;
  border-radius: 16px;
  background: #173d2b;
}
.stats {
  display: flex;
  justify-content: space-around;
  gap: 8px;
}
.stat {
  flex: 1;
  padding: 10px 4px;
  border-radius: 10px;
  background: #24573a;
}
.stat strong {
  display: block;
  font-size: 24px;
  color: #ffe66d;
}
.field {
  position: relative;
  width: min(94vw, 500px);
  height: 370px;
  margin: 16px auto;
  overflow: hidden;
  border: 3px solid white;
  border-radius: 8px;
  background: repeating-linear-gradient(
    0deg, #258747 0 46px, #2c9850 46px 92px
  );
}
.line {
  position: absolute;
  inset: 10px;
  border: 2px solid #ffffffb0;
}
.penalty-area {
  position: absolute;
  top: 0;
  left: 17%;
  width: 66%;
  height: 105px;
  border: 2px solid white;
  border-top: none;
}
.goal {
  position: absolute;
  top: 8px;
  left: 25%;
  width: 50%;
  height: 70px;
  border: 7px solid white;
  border-top: 5px solid white;
  background: repeating-linear-gradient(
    90deg, #ffffff28 0 10px, #ffffff65 10px 12px
  );
  box-shadow: 0 3px 8px #0007;
}
#keeper {
  position: absolute;
  top: 24px;
  left: 50%;
  z-index: 2;
  font-size: 43px;
  transform: translateX(-50%);
  transition: left .3s ease;
}
#ball {
  position: absolute;
  left: 50%;
  bottom: 47px;
  z-index: 3;
  font-size: 37px;
  transform: translateX(-50%);
  transition: left .45s ease, bottom .45s ease;
}
.aim {
  position: absolute;
  top: 125px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff5a6;
  font-size: 14px;
  font-weight: bold;
}
.controls { max-width: 540px; margin: auto; }
.targets {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
button {
  padding: 13px 10px;
  border: 0;
  border-radius: 11px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
}
.targets button {
  flex: 1;
  background: #d7f3df;
  color: #153b25;
}
.targets button.selected {
  background: #ffe15a;
  outline: 3px solid white;
}
#shoot {
  width: 100%;
  background: #ffcf35;
  color: #28200b;
  font-size: 19px;
}
#reset {
  margin-top: 9px;
  background: #315a47;
  color: white;
}
button:disabled { opacity: .5; cursor: default; }
#message {
  min-height: 28px;
  font-size: 18px;
  font-weight: bold;
  color: #ffe66d;
}
.hint { font-size: 13px; }
</style>
</head>
<body>

<h1>⚽ SUPER PENALTI</h1>
<p>Darvozabonni aldang va gol uring!</p>

<div class="panel stats">
  <div class="stat">Gollar<strong id="goals">0</strong></div>
  <div class="stat">Zarbalar<strong id="shots">0/5</strong></div>
  <div class="stat">Seyvlar<strong id="saves">0</strong></div>
</div>

<div class="field" id="field">
  <div class="line"></div>
  <div class="penalty-area"></div>
  <div class="goal"></div>
  <div id="keeper">🧤</div>
  <div class="aim" id="aim">NISHONNI TANLANG</div>
  <div id="ball">⚽</div>
</div>

<div class="controls">
  <p>Qayerga tepmoqchisiz?</p>
  <div class="targets">
    <button data-target="left">⬅ Chap</button>
    <button data-target="center" class="selected">⬆ Markaz</button>
    <button data-target="right">O‘ng ➡</button>
  </div>

  <button id="shoot">⚽ TO‘P TEPISH</button>
  <p id="message" aria-live="polite">Birinchi zarbangizni bering!</p>
  <p class="hint">5 ta imkoniyat bor. Ko‘proq gol urishga harakat qiling!</p>
  <button id="reset">🔄 QAYTA BOSHLASH</button>
</div>

<script>
const $ = id => document.getElementById(id);

let goals = 0;
let shots = 0;
let saves = 0;
let target = "center";
let busy = false;

const positions = {
  left: 34,
  center: 50,
  right: 66
};

const buttons = document.querySelectorAll("[data-target]");

buttons.forEach(button => {
  button.addEventListener("click", () => {
    if (busy || shots >= 5) return;

    target = button.dataset.target;
    buttons.forEach(b => b.classList.toggle(
      "selected", b.dataset.target === target
    ));

    $("aim").textContent = {
      left: "CHAP TOMON",
      center: "MARKAZ",
      right: "O‘NG TOMON"
    }[target];
  });
});

function updateStats() {
  $("goals").textContent = goals;
  $("shots").textContent = `${shots}/5`;
  $("saves").textContent = saves;
}

function shoot() {
  if (busy || shots >= 5) return;

  busy = true;
  shots++;
  $("shoot").disabled = true;
  buttons.forEach(b => b.disabled = true);

  // Darvozabon chap, markaz yoki o‘ngga sakraydi.
  const choices = ["left", "center", "right"];
  const keeperChoice = choices[Math.floor(Math.random() * 3)];

  $("keeper").style.left = positions[keeperChoice] + "%";
  $("ball").style.left = positions[target] + "%";
  $("ball").style.bottom = "275px";
  $("aim").textContent = "ZARBA!";

  // Bir xil yo‘nalishda bo‘lsa, darvozabon seyv qilishi mumkin.
  const saved = target === keeperChoice;

  if (saved) {
    saves++;
    $("message").textContent = "🧤 Ajoyib seyv! Darvozabon qaytardi!";
  } else {
    goals++;
    $("message").textContent = "🥅 GOOOL! Zo‘r zarba!";
  }

  updateStats();

  setTimeout(() => {
    $("ball").style.left = "50%";
    $("ball").style.bottom = "47px";

    if (shots >= 5) {
      $("message").textContent =
        `🏆 O‘yin tugadi! Natija: ${goals} gol, ${saves} seyv.`;
      $("aim").textContent = "O‘YIN TUGADI";
      $("shoot").textContent = "O‘YIN TUGADI";
    } else {
      $("aim").textContent = "KEYINGI ZARBANI TANLANG";
      busy = false;
      $("shoot").disabled = false;
      buttons.forEach(b => b.disabled = false);
    }
  }, 700);
}

function resetGame() {
  goals = 0;
  shots = 0;
  saves = 0;
  target = "center";
  busy = false;

  $("keeper").style.left = "50%";
  $("ball").style.left = "50%";
  $("ball").style.bottom = "47px";
  $("aim").textContent = "NISHONNI TANLANG";
  $("message").textContent = "Yangi o‘yin boshlandi!";
  $("shoot").textContent = "⚽ TO‘P TEPISH";
  $("shoot").disabled = false;

  buttons.forEach(b => {
    b.disabled = false;
    b.classList.toggle("selected", b.dataset.target === "center");
  });

  updateStats();
}

$("shoot").addEventListener("click", shoot);
$("reset").addEventListener("click", resetGame);
</script>
</body>
</html>
